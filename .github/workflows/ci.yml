# Continuous integration. host: the generated headers, every host platform and the tests that need no FM-1 package
# (on every push and pull request). firmware: the FM-1 build with JieLi's toolchain and SDK, then every test (on a tag,
# and by hand: it downloads the toolchain from JieLi's server and the SDK from gitee).
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev libasound2-dev
          pip3 install --break-system-packages Pillow fonttools mido
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: mymindstorm/setup-emsdk@v14
      - name: Generated headers and the host platforms
        run: ./build.sh host
      - name: Tests (without the FM-1 package)
        run: sh tests/run_tests.sh
  firmware:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev libasound2-dev
          pip3 install --break-system-packages Pillow fonttools mido
      - name: JieLi toolchain and SDK
        run: |
          tools/get_toolchain.sh
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
      - name: The FM-1 firmware
        run: ./build.sh
      - name: Tests
        run: sh tests/run_tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: felucca-fm1
          path: |
            build/felucca.fwsc
            build/felucca.bin
